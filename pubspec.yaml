name: gold_track_app
description: Gold Track Vietnam - Ứng dụng theo dõi giá vàng và ngoại tệ
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  json_annotation: ^4.8.1

  # State Management
  flutter_bloc: ^8.1.3
  provider: ^6.1.5+1
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.0
  # retrofit: ^4.9.2
  logger: ^1.4.0

  # Location
  # geolocator: ^13.0.1
  # geocoding: ^3.0.0
  # permission_handler: ^11.0.1

  # Local Storage
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.18.1
  pull_to_refresh: ^2.0.0
  shimmer: ^3.0.0

  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  # retrofit_generator: ^7.0.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env
